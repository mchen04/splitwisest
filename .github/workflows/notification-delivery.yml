name: Retry notification delivery
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: notification-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deliver queued notifications
        env:
          DELIVERY_URL: ${{ secrets.PUSH_DELIVERY_URL }}
          DELIVERY_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          if [ -z "$DELIVERY_URL" ] || [ -z "$DELIVERY_SECRET" ]; then
            echo 'Notification delivery is not configured.'
            exit 1
          fi
          case "$DELIVERY_URL" in
            https://*/api/notifications/deliver) ;;
            *) echo 'Invalid delivery destination.'; exit 1 ;;
          esac
          curl --silent --show-error --fail --max-time 65 --retry 1 \
            --request POST --header "Authorization: Bearer $DELIVERY_SECRET" \
            "$DELIVERY_URL"
