services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: splitwisest
    ports:
      - "127.0.0.1:${SPLITWISEST_PG_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "splitwisest"]
      interval: 1s
      timeout: 5s
      retries: 30
  proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/splitwisest
    ports:
      - "127.0.0.1:${SPLITWISEST_PROXY_PORT:-4444}:4444"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
